<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{% block title %}Opportunity Intel{% endblock %}</title><style>
:root{--ink:#16202a;--muted:#65717c;--line:#d9e0e6;--panel:#fff;--bg:#f4f6f8;--accent:#075985;--good:#18794e;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}nav{background:#102a43;color:#fff;padding:14px 24px}nav a{color:#fff;margin-right:24px;text-decoration:none}.wrap{max-width:1200px;margin:24px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.metric{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted)}a{color:var(--accent)}.score{font-weight:700}.tag{display:inline-block;background:#e7f0f5;border-radius:12px;padding:2px 8px}.muted{color:var(--muted)}
