{% extends "base.html" %}{% block content %}<h1>Human review queue</h1><table><tr><th>Type</th><th>Entity</th><th>Confidence</th><th>Reason</th><th>Status</th></tr>{% for i in items %}<tr><td>{{ i.review_type }}</td><td>{{ i.entity_type }} {{ i.entity_id }}</td><td>{{ i.confidence or '—' }}</td><td>{{ i.reason }}</td><td>{{ i.status }}</td></tr>{% else %}<tr><td colspan="5">Queue is empty.</td></tr>{% endfor %}</table>{% endblock %}
