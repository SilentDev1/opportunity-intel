[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-intel"
version = "0.1.0"
description = "Evidence-first New Hampshire business opportunity intelligence"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=6,<8", "respx>=0.22,<1", "ruff>=0.8,<1"]

[project.scripts]
opportunity-intel = "opportunity_intel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true

