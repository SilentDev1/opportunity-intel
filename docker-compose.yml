services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opportunity_intel
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: opportunity
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity_intel"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:

